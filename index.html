<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 80px;
            font-size: 38px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container1"> 
        <input type="text" id="input" placeholder="Enter value">
        <button id="pasteBtn">Paste</button>
    </div>
    <div id="result"></div>

    <script>
        const input = document.getElementById("input");
        const pasteBtn = document.getElementById("pasteBtn");
        const result = document.getElementById("result");

        pasteBtn.addEventListener("click", function() {
            navigator.clipboard.readText().then(text => {
                input.value = text;
                check();
            });
        });

        input.addEventListener("input", check);

        function check(){
            let value = input.value;
            value = value.trim();
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            if (!isNaN(value) && value.length === 10) {
                result.style.color = "black";
                result.textContent = convert(value);
            }
        }

        function factorial(n) {
            let result = 1;
            for (let i = 1; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function c(str){
            x = parseInt(str[0]);
            y = parseInt(str.slice(1,3));
            z = String.fromCharCode((y-1)%26+65)
            return x%2 ? z.toLowerCase() : z;
        }

        function convert(value) {
            if (value.length !== 10 || isNaN(value)) {
                return "error";
            }
            let tmp = 1;
            const part1 = value.slice(0, 3);
            const part2 = value.slice(3, 6);
            for (let i = 6; i < 10; i++) {
                tmp *= factorial(parseInt(value[i]));
            }
            const part3 = String(tmp).padStart(4,"0").slice(0,4);
            return `${c(part1)}${c(part2)}${part3}`;
        }

        function copyToClipboard() {
            const text = result.textContent;
            navigator.clipboard.writeText(text).then(() => {
                result.style.color = "red";
            });
        }

        result.addEventListener("click", copyToClipboard);
        result.addEventListener("change", function() {
            result.style.color = "black";
        });
    </script>
</body>
</html>
